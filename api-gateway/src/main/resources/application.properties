# file: C:/Users/sivap/Downloads/PrimeHaven-Microservices/PrimeHaven-Microservices/api-gateway/src/main/resources/application.properties
spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Global CORS Configuration for Frontend (React, Angular, etc.)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization

# Route definitions
spring.cloud.gateway.routes[0].id=property-service
spring.cloud.gateway.routes[0].uri=lb://PROPERTY-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/properties, /properties/**

spring.cloud.gateway.routes[1].id=visit-service
spring.cloud.gateway.routes[1].uri=lb://VISIT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/visits, /visits/**

spring.cloud.gateway.routes[2].id=inquiry-service
spring.cloud.gateway.routes[2].uri=lb://INQUIRY-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/inquiries, /inquiries/**

spring.cloud.gateway.routes[3].id=auth-service
spring.cloud.gateway.routes[3].uri=lb://AUTH-SERVICE
# Fixed typo – the predicate now correctly matches any /auth/** path.
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/**