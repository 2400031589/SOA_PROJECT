spring.application.name=eureka-server

# Eureka Server must listen on 8761 (the default) – this is the *only* port setting.
server.port=8761

# The server itself never registers with another Eureka instance.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable the self‑preservation mechanism while developing locally.
eureka.server.enable-self-preservation=false